server:
  port: 0

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://${eureka.instance.hostname}:8761/eureka/

spring:
  application:
    name: product-service

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5435/product-service-db
    username: username
    password: password


  jpa:
    open-in-view: false
    show-sql: true

    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      cluster:
        nodes:
          - redis-cluster.ecommerce-platform-project:6379
          - redis-cluster.ecommerce-platform-project:6380
          - redis-cluster.ecommerce-platform-project:6381
      timeout: 5s
  cache:
    redis:
      time-to-live: 60000
      use-key-prefix: true
      key-prefix: "product:"

  liquibase:
    enabled: false
    change-log: classpath:/db/changelog/db.changelog-master.xml