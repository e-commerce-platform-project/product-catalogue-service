server:
  port: 0

spring:
  application:
    name: product-service

  datasource:
    driver-class-name: ${SPRING_DATASOURCE_DRIVER}
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    open-in-view: false
    show-sql: true

    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        show_sql: true

#  data:
#    redis:
#      host: ${REDIS_HOST}
#      port: ${REDIS_PORT}
#  cache:
#    redis:
#      time-to-live: 60000
#      use-key-prefix: true
#      key-prefix: "product:"

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.xml